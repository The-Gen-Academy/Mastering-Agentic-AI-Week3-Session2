[project]
name = "course-docs-mcp"
version = "0.1.0"
description = "Read-only Streamable HTTP MCP server exposing public course Google Docs as MCP resources."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.7",
]

[project.scripts]
course-docs-mcp = "course_docs_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_docs_mcp"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
