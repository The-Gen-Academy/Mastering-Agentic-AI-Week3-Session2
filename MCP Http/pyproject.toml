[project]
name = "course-docs-mcp"
version = "0.2.0"
description = "Read-only MCP tools and resources for public course project handouts."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.7",
    "httpx2>=2.10.0,<3",
]

[project.scripts]
course-docs-mcp = "course_docs_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_docs_mcp"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
